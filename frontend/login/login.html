<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8ff">
    <title>Masuk Admin | Cipta Jaya</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="script/script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <div class="page-content">
        <section class="login-card" aria-labelledby="page-title">
          <div class="card-content">
            <header class="brand">
              <div class="brand-mark" role="img" aria-label="Logo Cipta Jaya"></div>
              <h1 id="page-title">CIPTA JAYA</h1>
              <p class="brand-description">BAHAN BANGUNAN &bull; BUILDING MATERIALS</p>
              <p class="portal-description">Portal Masuk Admin Toko</p>
            </header>

            <form class="login-form" action="/api/admin/login" method="post">
              <div class="field">
                <label for="username">Username</label>
                <div class="input-wrap">
                  <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                  <input
                    id="username"
                    name="username"
                    type="text"
                    placeholder="Masukkan username admin"
                    autocomplete="username"
                    required
                  >
                </div>
              </div>

              <div class="field">
                <label for="password">Kata Sandi</label>
                <div class="input-wrap">
                  <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="4" y="10" width="16" height="11" rx="2"></rect>
                    <path d="M8 10V7a4 4 0 1 1 8 0v3"></path>
                    <path d="M12 14v3"></path>
                  </svg>
                  <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="Masukkan kata sandi"
                    autocomplete="current-password"
                    required
                  >
                  <button
                    class="password-toggle"
                    type="button"
                    aria-label="Tampilkan kata sandi"
                    aria-pressed="false"
                    aria-controls="password"
                  >
                    <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                  </button>
                </div>
              </div>

              <div class="form-options">
                <label class="remember-option" for="remember">
                  <input id="remember" name="remember" type="checkbox" value="1">
                  <span>Ingat saya</span>
                </label>
                <a class="help-link" href="/admin/forgot-password">Bantuan Masuk</a>
              </div>

              <button class="submit-button" type="submit">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M10 17l5-5-5-5"></path>
                  <path d="M15 12H3"></path>
                  <path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"></path>
                </svg>
                <span>Masuk ke Dashboard</span>
              </button>
            </form>
          </div>

          <a class="back-link" href="/">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19 12H5"></path>
              <path d="m12 19-7-7 7-7"></path>
            </svg>
            <span>Kembali ke Katalog Toko</span>
          </a>
        </section>

        <footer class="copyright">
          &copy; Toko Bahan Bangunan Cipta Jaya &bull; Khusus Staf &amp; Pemilik
        </footer>
      </div>
    </main>
  </body>
</html>
